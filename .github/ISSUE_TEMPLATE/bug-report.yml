name: Something went wrong
description: A script failed, or the TV did something unexpected after a run
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Run `./scripts/verify.sh` first and include what it printed.
        **Remove IP addresses, MAC addresses, serial numbers, Wi-Fi names and account emails before posting.**

  - type: input
    id: tv
    attributes:
      label: TV or stick
      description: Brand and model, for example "Amazon Fire TV Stick 4K Max" or "Insignia NS-50F301NA24"
    validations:
      required: true

  - type: input
    id: build
    attributes:
      label: Fire OS version or build
      description: `adb shell getprop ro.build.display.id`
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Which script you ran, what you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output
      description: The script's output, and what `./scripts/verify.sh` printed
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed IP addresses, MAC addresses, serial numbers, Wi-Fi names and emails
          required: true
