    </filter>
  </defs>
  <rect width="120" height="120" rx="28" fill="#0B0D10"/>
  <g transform="translate(0 2)">
    <rect x="14" y="56.2" width="92" height="4.6" rx="2.3" fill="url(#beam)" filter="url(#glow)"/>
    <rect x="27" y="56.8" width="66" height="3.4" rx="1.7" fill="#FFFFFF"/>
    <circle cx="60" cy="58.5" r="4.2" fill="#FFFFFF" filter="url(#glow)"/>
