<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="512" height="512">
  <defs>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9CC2FF"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <g transform="translate(10 12) scale(1)">
    <rect x="2" y="4" width="96" height="72" rx="20" fill="#0B0D10" stroke="#0B0D10" stroke-width="2"/>
    <rect x="14" y="38.2" width="72" height="3.6" rx="1.8" fill="url(#beam)" filter="url(#glow)"/>
    <rect x="24" y="38.6" width="52" height="2.8" rx="1.4" fill="#FFFFFF"/>
    <circle cx="50" cy="40" r="3.4" fill="#FFFFFF" filter="url(#glow)"/>
    <rect x="32" y="84" width="36" height="6" rx="3" fill="#0B0D10" stroke="#0B0D10" stroke-width="2"/>
  </g>
</svg>