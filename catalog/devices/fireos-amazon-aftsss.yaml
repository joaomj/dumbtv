id: fireos-amazon-aftsss
title: "Amazon Fire TV Stick, 3rd gen (AFTSSS)"
contributors:
  - B3NR1S
platform: fireos
status: partial
tested_on: "PS7717.5741N"
models: []
adb:
  port: 5555
  transport: wifi
developer_mode: >-
  Settings > My Fire TV > About > click the device name 7 times, then My Fire TV > Developer Options > ADB debugging: ON
ip_location: "Settings > My Fire TV > About > Network"
prompts:
  - name: "Allow VPN connection"
    blocks_automation: true
    fix: "VPN permissions weren't granted automatically. Launching personalDNSfilter via ADB (adb shell monkey -p dnsfilter.android 1) brought up the permission dialog, which I accepted using the Fire TV remote. Running the verification script afterwards confirmed that all blocking rules are active"
data:
  packages: data/fireos/packages.txt
  protected: data/fireos/protected.txt
  never_disable: data/fireos/never-disable.txt
  user_apps: data/fireos/user-apps.txt
quirks: []
notes: "Debloat and the DNS filter work; verify.sh confirmed every blocking rule after the VPN prompt was accepted by hand. Keep battery optimisation off for personalDNSfilter so Fire OS does not stop it."
verify:
  blocked: data/blocklists/verify-blocked.txt
  allowed: data/blocklists/verify-allowed.txt
